# Sardorbek Furnitura — Nginx reverse proxy
# Place at: /etc/nginx/sites-available/sardorbek.biznesjon.uz

upstream api_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name sardorbek.biznesjon.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sardorbek.biznesjon.uz;

    # SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/sardorbek.biznesjon.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sardorbek.biznesjon.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Frontend (SPA)
    root /var/www/sardorbek/current/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-cache";
        # Security headers (repeated for this location)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Static assets (long cache)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API proxy
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # WebSocket (Socket.IO)
    location /socket.io/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Uploads (static serve with cache)
    location /uploads/ {
        alias /var/www/sardorbek/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;

        # Prevent script execution in uploads
        location ~* \.(php|py|pl|sh|cgi)$ {
            deny all;
        }
    }

    # Health check (no auth, no logging)
    location /api/v1/health/ {
        proxy_pass http://api_backend;
        access_log off;
    }

    # Rate limiting for uploads
    location /api/v1/upload {
        client_max_body_size 10m;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }
}
